<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Álvaro Navarro Porcuna">
    <meta name="description" content="Pagina Principal Practicas con Acceso a Restaurante">
    <meta name="keywords" content="contacto, restaurante, formulario">
    <title>Contacto</title>
    <link rel="icon"  sizes="32x32" href="imagenes/favicon.jpg">
  </head>
  <body>
    <header>
      <h1>Reserva</h1>
    </header>
    <nav>
        <a href="index.html">Volver a Restaurante</a>
    </nav>
    <main>
        <p>Formulario de contacto</p>
        <fieldset>
          <legend>Formulario de contacto</legend>
          <input type="text" name="Nombre" placeholder="Su Nombre">
          <input type="text" name="Email" placeholder="Su Email">
          <input type="text" name="Telefono" placeholder="Su Teléfono">
          <br><br>
          <input type="text" name="Asunto" placeholder="Asunto">
          <br><br>
          <textarea name="Mensaje" rows="10" cols="50" maxlength="1000" placeholder="Escriba su mensaje"></textarea>
          <br>
          <p>Máximo 1000 caracteres</p>
          <br>
        </fieldset>
        <br>
        <input type="submit" value="Enviar">
    </main>
    <footer>
     <p>© 2026
     </p>
    </footer>
  </body>
</html>
